; Shared base environment for Freenove FNK0104S tutorial chapters, ported the
; same way as the sibling FNK0104B project (github.com/Grey-Lancaster/Freenove104b):
; each NN_Name/platformio.ini pulls this in via `extra_configs`, then `extends`
; one of the envs below.
;
; Board def note: the generic esp32-s3-devkitc-1 board defaults to "No PSRAM"
; and crashes (Guru Meditation StoreProhibited) on boot if PSRAM is forced on
; via a plain build flag instead of a matching board def -- see
; ../boards/ESP32-S3-WROOM-1-N16R8.json. ASSUMPTION: carried over from the
; FNK0104B project on the belief the FNK0104 line shares the same
; ESP32-S3-WROOM-1 N16R8 (16MB flash / 8MB octal PSRAM) module across screen
; sizes -- not yet confirmed against this board's own schematic/datasheet.
; If the S board boots into a crash loop, this is the first thing to check.

[env:base]
platform = espressif32@6.10.0
board = ESP32-S3-WROOM-1-N16R8
framework = arduino
monitor_speed = 115200
board_build.partitions = default_16MB.csv
lib_extra_dirs = ../lib_freenove
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1

; --- Shared base for chapters that drive the ST7796 TFT ---
; TFT_eSPI panel config translated from Freenove's own
; Libraries/FNK0104S/TFT_eSPI_Setups_v1.2.zip -> FNK0104S_4.0_320x480_ST7796.h
; (from the official Freenove_ESP32_S3_Display repo). Differences from the
; FNK0104B (2.8" ILI9341) env this was ported from:
;   - ST7796_DRIVER instead of ILI9341_2_DRIVER
;   - no TFT_WIDTH/TFT_HEIGHT -- the ST7796 driver has its 320x480 built in
;   - no TFT_RGB_ORDER override -- Freenove's own setup file leaves this at
;     its default for this panel; if colors come out red/blue swapped, add
;     -DTFT_RGB_ORDER=TFT_BGR here
;   - no TFT_MISO -- not wired/used on this panel
;   - SPI_FREQUENCY raised to 80MHz (vs. 40MHz for the smaller ILI9341 panel)
;   - USE_HSPI_PORT is required here (the FNK0104B env explicitly must NOT
;     define this -- don't copy that env's assumption for this board)
[env:tft_base]
extends = env:base
lib_deps =
    ${env:base.lib_deps}
    https://github.com/Bodmer/TFT_eSPI.git
build_flags =
    ${env:base.build_flags}
    -DUSER_SETUP_LOADED=1
    -DST7796_DRIVER=1
    -DTFT_INVERSION_ON=1
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_DC=46
    -DTFT_RST=-1
    -DTFT_BL=45
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=80000000
    -DUSE_HSPI_PORT=1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
